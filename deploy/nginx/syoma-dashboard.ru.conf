# Nginx reverse proxy для Streamlit-дашборда на домене syoma-dashboard.ru
# Установка: sudo cp deploy/nginx/syoma-dashboard.ru.conf /etc/nginx/sites-available/syoma-dashboard.ru
#            sudo ln -s /etc/nginx/sites-available/syoma-dashboard.ru /etc/nginx/sites-enabled/
#            sudo nginx -t && sudo systemctl reload nginx
#            sudo certbot --nginx -d syoma-dashboard.ru -d www.syoma-dashboard.ru
# Certbot сам добавит блок listen 443 ssl и редирект с http на https.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name syoma-dashboard.ru www.syoma-dashboard.ru;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;

        # Streamlit работает через WebSocket — без этих заголовков страница
        # зависает на «Please wait...» / «Connecting...»
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }
}
